<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="Infragauge logo">
  <defs>
    <linearGradient id="ironbow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#20256e"/>
      <stop offset="0.35" stop-color="#8a1f8f"/>
      <stop offset="0.68" stop-color="#e05a1c"/>
      <stop offset="1" stop-color="#ffd23c"/>
    </linearGradient>
  </defs>
  <!-- device faceplate -->
  <rect x="8" y="8" width="224" height="224" rx="34" fill="#23272d"/>
  <!-- FLIR-style reticle corners -->
  <g stroke="#5b6570" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M 34 48 L 34 34 L 48 34"/>
    <path d="M 192 34 L 206 34 L 206 48"/>
    <path d="M 206 176 L 206 190 L 192 190"/>
    <path d="M 48 190 L 34 190 L 34 176"/>
  </g>
  <!-- thermal gauge arc -->
  <path d="M 46 148 A 74 74 0 0 1 194 148" fill="none" stroke="url(#ironbow)" stroke-width="20" stroke-linecap="round"/>
  <!-- tick marks -->
  <g stroke="#8a939c" stroke-width="3.5" stroke-linecap="round">
    <line x1="120" y1="60" x2="120" y2="72"/>
    <line x1="68" y1="82" x2="76" y2="91"/>
    <line x1="172" y1="82" x2="164" y2="91"/>
  </g>
  <!-- needle into the hot zone -->
  <line x1="120" y1="148" x2="170" y2="101" stroke="#f4f4ef" stroke-width="7" stroke-linecap="round"/>
  <circle cx="120" cy="148" r="10" fill="#f4f4ef"/>
  <circle cx="120" cy="148" r="4.5" fill="#23272d"/>
  <!-- wordmark -->
  <text x="120" y="204" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="19" font-weight="600" letter-spacing="2.5" fill="#f4f4ef">INFRAGAUGE</text>
</svg>
